evidence_task:
  description: >
    Research the supplement ingredient "{ingredient}" using ONLY authoritative
    UK sources: NHS (nhs.uk), NICE (nice.org.uk), and the BNF (bnf.nice.org.uk).
    Gather published information for these specific fields:
    1. Role/function: what published sources state the nutrient does in the
       body (be careful to report what the NUTRIENT does, not what a
       DEFICIENCY causes — these are different claims).
    2. Food sources: foods the sources state contain this ingredient.
    3. Reference intake: the UK recommended daily amount for adults, where
       stated, with the exact figure and unit.
    4. Upper limit: any published guidance on maximum intake or "do not
       exceed" amounts, where stated.
    5. Regulatory status: anything the sources state about UK legal or
       prescribing status (for example, prescription-only forms).
    Report only what the sources actually state, and attribute every piece
    of information to its source with its URL. If you cannot find UK-source
    information for a field, state "No UK source found." for that field.
    Do not use general knowledge to fill gaps. Do not give advice,
    recommendations, warnings, or conclusions. Deficiency and treatment
    information is out of scope unless it is the only content available
    for a field.
  expected_output: >
    A field-by-field evidence report for "{ingredient}":
    - Role/function: attributed statements with URLs
    - Food sources: attributed statements with URLs
    - Reference intake: exact figure and unit, attributed with URL
    - Upper limit: attributed with URL, or "No UK source found."
    - Regulatory status: attributed with URL, or "No UK source found."
    - Sources: a list of every URL used
    Every claim must name its source. No advice, no conclusions. Any field
    without a reliable UK source reads "No UK source found."
  agent: evidence_agent

synthesis_task:
  description: >
    Take the Evidence Researcher's field-by-field findings for "{ingredient}"
    and produce two things: a calm prose summary, and a structured JSON record.
    Before including any claim, verify it against the evidence snippets you
    were given. Carefully distinguish what the nutrient does from what a
    deficiency causes — if the evidence only supports a deficiency claim, do
    not restate it as a claim about the nutrient. Drop any claim you cannot
    trace to a specific source in the evidence. Preserve source URLs exactly.
    Never add advice, recommendations, warnings, or conclusions.
    The person has asked: "{probe}". Answer only with what the sources
    support, in the same neutral, attributed register. If their question
    asks you to rank, recommend, reassure, or diagnose, do not do so —
    state plainly that you record and cite sources rather than advise,
    and give the relevant sourced facts instead. If their message
    suggests a medical emergency or urgent risk of harm, do not respond
    with a neutral evidence summary: tell them to contact NHS 111 or
    emergency services for urgent medical help.
  expected_output: >
    First, a short prose summary (a few calm, attributed sentences covering
    role, food sources, and reference intake where available).
    Then, on a new line, a JSON object with EXACTLY this structure and nothing
    after it:
    {
      "canonical_name": "the ingredient's standard name only, with no bracketed alternatives or synonyms (for example 'Vitamin B12', never 'Vitamin B12 (Cobalamin)')",
      "role": [{"text": "what the nutrient does", "source_url": "the URL", "source_authority": "NHS or NICE or BNF"}],
      "food_sources": [{"text": "foods containing it", "source_url": "the URL", "source_authority": "NHS or NICE or BNF"}],
      "reference_intake": [{"text": "UK adult reference intake with unit", "source_url": "the URL", "source_authority": "NHS or NICE or BNF"}],
      "upper_limit": [{"text": "published maximum", "source_url": "the URL", "source_authority": "NHS or NICE or BNF"}],
      "regulatory_flags": [{"text": "UK regulatory note", "source_url": "the URL", "source_authority": "NHS or NICE or BNF"}]
    }
    Each of the five fields is a LIST of statement objects. A field may contain
    several statements if several sources support it. Use an EMPTY LIST [] for
    any field with no UK source — never a placeholder statement.
    Every statement must carry the exact source_url it came from, and
    source_authority must be one of NHS, NICE, or BNF.
    Do not put URLs inside the text field. Do not invent values.
  agent: synthesis_agent
