evidence_task:
  description: >
    Research the supplement ingredient "{ingredient}" using ONLY authoritative
    UK sources: NHS (nhs.uk), NICE (nice.org.uk), and the BNF (bnf.nice.org.uk).
    Find published information about what this ingredient is, what published
    sources state about its role in the body, the UK guidance on intake where
    stated, and any UK regulatory status the sources mention (for example,
    if a substance is prescription-only in the UK).
    Report only what the sources actually state, and attribute every piece of
    information to its source. If you cannot find information from these
    sources, state that plainly. Do not use general knowledge to fill gaps.
    Do not give advice, recommendations, warnings, or conclusions.
  expected_output: >
    A short, neutral evidence summary for "{ingredient}" in this structure:
    - What it is: one or two sentences, attributed (e.g. "The NHS states...")
    - Published guidance: what UK sources state about intake, attributed
    - UK regulatory notes: only if stated by a source, attributed
    - Sources: a list of every URL used
    Every claim must name its source. No advice, no conclusions, no
    recommendations. If no reliable UK source was found for a section,
    write "No UK source found." for that section.
  agent: evidence_agent
